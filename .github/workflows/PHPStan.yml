name: PHPStan

on:
  pull_request:

permissions: read-all

jobs:
  build:
    uses: The-FireHub-Project/.github/.github/workflows/RunCommandOnMatrix.yml@master
    with:
      title: "Run PHPStan"
      tools: "phpstan:2.x"
      command: "phpstan analyse"
    secrets:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}